<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Carlito', Calibri, Arial, sans-serif; background: #f5f5f5; padding: 16px; }
  .palette { display: flex; gap: 0; height: 60px; border-radius: 2px; overflow: hidden; }
  .swatch { flex: 1; display: flex; align-items: flex-end; padding: 5px 6px; }
  .swatch span { font-size: 9px; font-weight: 700; }
  .row { display: flex; gap: 10px; margin-bottom: 10px; align-items: flex-start; }
  .label { font-size: 9px; color: #666; margin-top: 4px; }
  .name { font-size: 10px; font-weight: 700; color: #222; }
  .hex  { font-size: 9px; color: #777; font-family: monospace; }
  .swatch-sm { width: 36px; height: 36px; border: 1px solid #ddd; flex-shrink: 0; }
</style>
<link href="https://fonts.googleapis.com/css2?family=Carlito:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>
  <div class="palette">
    <div class="swatch" style="background:#33ABBF"><span style="color:#fff">#33ABBF</span></div>
    <div class="swatch" style="background:#B2E8F1"><span style="color:#1a4a5a">#B2E8F1</span></div>
    <div class="swatch" style="background:#5B9BD5"><span style="color:#fff">#5B9BD5</span></div>
    <div class="swatch" style="background:#D9D9D9"><span style="color:#333">#D9D9D9</span></div>
    <div class="swatch" style="background:#808080"><span style="color:#fff">#808080</span></div>
    <div class="swatch" style="background:#1a1a1a"><span style="color:#fff">#1a1a1a</span></div>
    <div class="swatch" style="background:#fff; border:1px solid #ddd"><span style="color:#999">#FFFFFF</span></div>
  </div>
  <div class="row" style="margin-top:10px;">
    <div><div class="swatch-sm" style="background:#33ABBF"></div><div class="name">Teal</div><div class="hex">#33ABBF</div><div class="label">Footer · Accent</div></div>
    <div><div class="swatch-sm" style="background:#B2E8F1"></div><div class="name">Light Blue</div><div class="hex">#B2E8F1</div><div class="label">Header · Sections</div></div>
    <div><div class="swatch-sm" style="background:#5B9BD5"></div><div class="name">Blue</div><div class="hex">#5B9BD5</div><div class="label">Author block · Figs</div></div>
    <div><div class="swatch-sm" style="background:#D9D9D9"></div><div class="name">Gray Light</div><div class="hex">#D9D9D9</div><div class="label">Section headers</div></div>
  </div>
</body>
</html>
